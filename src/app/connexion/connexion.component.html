<div class="login-container">
  <div class="login-left">
    <div class="logo-container">
      <img src="assets/images/logo.png" alt="Sunu Pepiniere" class="logo">
    </div>
    <div class="illustration">
      <img src="assets/images/login.svg" alt="Illustration" class="illustration-img">
    </div>
  </div>

  <div class="login-right">
    <h1>Bienvenue sur Sunu Pepiniere</h1>

    <div class="login-card">
      <h2>Veuillez saisir votre code</h2>
      <p class="subtitle">Vous pouvez aussi vous connecter par carte</p>
      
      <input type="hidden" id="cardIdInput" class="form-control" placeholder="Entrez la Card ID" >

      <!-- Ajout de [formGroup] pour lier le formulaire -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="code-input-container">
          <input 
            #code1 type="text" maxlength="1" 
            formControlName="code1" class="code-input"
            (input)="moveFocus(code1, code2)" 
            (keydown.backspace)="moveBack(code1, null)">
            
              
          <input 
            #code2 type="text" maxlength="1" 
            formControlName="code2" class="code-input"
            (input)="moveFocus(code2, code3)"
            (keydown.backspace)="moveBack(code2, code1)">
          
          <input 
            #code3 type="text" maxlength="1" 
            formControlName="code3" class="code-input"
            (input)="moveFocus(code3, code4)"
            (keydown.backspace)="moveBack(code3, code2)">
          
          <input 
            #code4 type="text" maxlength="1" 
            formControlName="code4" class="code-input"
            (input)="onLastInput(code4)"
            (keydown.backspace)="moveBack(code4, code3)">
        </div>

        <!-- Message d'erreur si formulaire invalide -->
        <!-- <p *ngIf="loginForm.invalid && loginForm.touched" class="error-message">
          Veuillez remplir tous les champs.
        </p> -->
        <p *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </p>
        
      </form>
    </div>
  </div>
</div>
